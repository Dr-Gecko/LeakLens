services:
  nginx:
    image: nginx:latest
    container_name: nginx_server
    ports:
      - "80:80"
    volumes:
      - ${PWD}/../web_data/frontend:/usr/share/nginx/html
      - ${PWD}/../data/shared:/usr/share/nginx/html/static/avatars/useruploaded
      - ${PWD}/../data/logs:/var/log/nginx
      - ${PWD}/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build: ${PWD}/../web_data/backend/
    container_name: fastapi_server
    ports:
      - "8081:8080"
    volumes:
      - ${PWD}/../web_data/backend/server:/app
      - ${PWD}/../data/shared:/app/avatars
      - /var/run/docker.sock:/var/run/docker.sock:ro

    working_dir: /app
    environment:
      SHARED_PUBLIC_DIR: /app/avatars
      DOCKER_HOST: unix:///var/run/docker.sock

    command: uvicorn main:app --host 0.0.0.0 --port 8080 --reload
    depends_on:
      - mariadb
    restart: unless-stopped

  mariadb:
    image: mariadb:latest
    container_name: mariadb_server
    ports:
      - "3305:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - ${PWD}/../data/mariadb:/var/lib/mysql
      - ${PWD}/mariadb-init:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped